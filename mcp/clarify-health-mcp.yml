READ_THIS_FIRST: >-
  This is a real, first-party MCP server — package.json names the author as "Clarify Health
  Solutions" and it lives in the company's own GitHub organization. But it does NOT expose
  Clarify Health's platform. It wraps the PUBLIC CMS data.cms.gov Data API
  (https://data.cms.gov/data-api/v1) so an agent can search and query Medicare/Medicaid
  datasets. Clarify Health publishes no MCP server for the Clarify Atlas or Meridian
  platform, and publishes no API for one to wrap. Do not read this artifact as an agent
  surface onto Clarify's own data.

distribution:
  registry_published: false
  npm: not published — the name "@clarify/cms-datagov-mcp-server" returns 404 on
    registry.npmjs.org (checked 2026-08-15)
  install_path: clone the repo, npm install, npm run build, npm link
  note: >-
    Source-only distribution. There is no `npx -y` one-liner, so an operator must clone and
    build before any agent can reach these tools.

upstream_api:
  name: CMS data.cms.gov Data API
  base_url: https://data.cms.gov/data-api/v1
  catalog: https://data.cms.gov/data.json
  owner: Centers for Medicare & Medicaid Services (U.S. federal government)
  auth: none (public)

tools:
- name: cms_search_datasets
  description: Search CMS datasets by keyword, theme, or title. Returns matching datasets
    with IDs, titles, descriptions, and available formats.
  input:
    query: {type: string, required: false}
    theme: {type: string, required: false}
    limit: {type: number, required: false}
- name: cms_get_dataset
  description: Get detailed information about a specific CMS dataset.
  input:
    dataset_id: {type: string, required: true}
- name: cms_query_dataset
  description: Query dataset records with filters, column selection, sorting and pagination.
  input:
    dataset_id: {type: string, required: true}
    filter: {type: string, required: false}
    columns: {type: string, required: false}
    sort: {type: string, required: false}
    offset: {type: number, required: false}
    size: {type: number, required: false}
- name: cms_get_dataset_stats
  description: Get row counts and column information for a dataset.
  input:
    dataset_id: {type: string, required: true}
- name: cms_get_csv_link
  description: Get the CSV download URL for a dataset, for large-scale analysis (e.g. loading
    into Athena).
  input:
    dataset_id: {type: string, required: true}

resources:
- uri: cms://datasets
  description: Browse all available CMS datasets.
- uri: cms://dataset/{id}
  description: Metadata for one CMS dataset.
- uri: cms://csv/{id}
  description: CSV download link for one CMS dataset.

tool_source:
  method: derived
  from: src/index.ts ListToolsRequestSchema handler at
