headline: >-
  Clarify Health publishes NO client SDK for any Clarify API — because it publishes no API.
  Every registry probe for a first-party client library returned 404. What the company does
  publish is a set of internal-tooling and data-science libraries in its public GitHub
  organization, distributed as SOURCE ONLY: not one of them is on npm, PyPI, Maven Central,
  crates.io, RubyGems or NuGet. A consumer cannot `npm install` or `pip install` anything
  Clarify Health has written.
