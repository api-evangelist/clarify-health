aid: clarify-health
name: Clarify Health
description: 'Clarify Health Solutions is a healthcare analytics and outcomes company that helps health
  systems, payers, and life sciences organizations understand cost, quality, and utilization across the
  care journey. Its flagship platform, Clarify Meridian, unifies referral intelligence, physician activation,
  consumer engagement, and outcomes attribution into a single analytics environment built on billions of
  longitudinal patient records and claims data. Clarify Health is backed by SoftBank Vision Fund and, in
  2026, acquired Loyal Health to expand its consumer engagement capabilities. The company operates a
  SaaS analytics product rather than a public developer API; this profile tracks its identity and public
  web surface within the API Evangelist network.'
